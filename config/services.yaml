parameters:
    stripe.secret_key: '%env(STRIPE_SECRET_KEY)%'
    stripe.webhook_secret: '%env(STRIPE_WEBHOOK_SECRET)%'
    stripe.price_monthly: '%env(STRIPE_PRICE_MONTHLY)%'
    stripe.price_yearly: '%env(STRIPE_PRICE_YEARLY)%'
    app.contact_email: '%env(APP_CONTACT_EMAIL)%'

twig:
    globals:
        stripe_price_monthly: '%env(STRIPE_PRICE_MONTHLY)%'
        stripe_price_yearly: '%env(STRIPE_PRICE_YEARLY)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/*'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Migrations/'
            - '../src/Tests/'
            - '../src/Kernel.php'

    OpenAI\Client:
        factory: ['OpenAI', 'client']
        arguments:
            - '%env(OPENAI_API_KEY)%'

    App\Service\AiClientInterface:
        alias: App\Service\OpenAiClient

    Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
        arguments:
            $pdoOrDsn: '%env(DATABASE_URL)%'
            $options:
                db_table: sessions

    App\Controller\ContactController:
        arguments:
            $contactEmail: '%app.contact_email%'

when@prod:
    services:
        Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
            arguments:
                $pdoOrDsn: '%env(DATABASE_URL)%'
                $options:
                    db_table: sessions
                    lock_mode: !php/const Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler::LOCK_ADVISORY
